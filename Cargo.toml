[package]
name = "drift-ts"
version = "0.1.0"
edition = "2024"

[lib]
name = "drift_ts"
path = "src/lib.rs"

[[bin]]
name = "drift-ts"
path = "src/main.rs"

[dependencies]
crc32fast = "1.4"
prost = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "signal"] }
toml = "0.9"
tonic = { version = "0.14", features = ["transport"] }
tonic-prost = "0.14"

[build-dependencies]
protoc-bin-vendored = "3.1"
tonic-prost-build = "0.14"

[dev-dependencies]
tempfile = "3.20"
